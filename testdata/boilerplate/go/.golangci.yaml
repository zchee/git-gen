# Fixture for internal/boilerplate: the placeholder lines of the golangci-lint template.
version: "2"

formatters:
  enable:
    # - gci
    - gofmt
    - gofumpt
    - goimports

  settings:
    gci:
      sections:
        - standard
        - default
        - blank
        - prefix(github.com/)
      custom-order: true
    gofumpt:
      module-path: github.com/
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/

linters:
  default: none
  enable:
    - testifylint # Checks usage of github.com/stretchr/testify. [auto-fix]

  settings:
    # goheader:
    #   template: |-
    #     Copyright {{ YEAR }} The example Authors.
