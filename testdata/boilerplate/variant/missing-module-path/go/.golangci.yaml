# Fixture for internal/boilerplate: the golangci-lint template without the
# gofumpt module-path placeholder, so its required rule matches nothing.
version: "2"

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/)
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/
